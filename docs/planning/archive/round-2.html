function house(){return `<div class="app-body">${header('Whole house','Maple House','plan')}<div class="pending">Later phase concept · multi-floor dollhouse</div><div class="context"><span class="small">2 floors · 6 rooms</span><button class="link-btn" data-action="fit-house">Fit house</button></div><div class="canvas house-canvas">${houseArt()}<div class="floor-pills"><button class="${state.floor==='all'?'sel':''}" data-floor="all">All floors</button><button class="${state.floor==='first'?'sel':''}" data-floor="first">First</button><button class="${state.floor==='ground'?'sel':''}" data-floor="ground">Ground</button></div><div class="hint">Drag to orbit · two-finger pan · pinch to zoom</div></div><div class="sheet"><div class="handle"></div><div class="row between"><h3>${state.floor==='all'?'All floors':state.floor==='first'?'First floor':'Ground floor'}</h3><span class="pill">Cutaway</span></div><div class="seg" style="margin:12px 0"><button data-action="cutaway" class="${state.cutaway?'sel':''}">Dollhouse</button><button data-action="cutaway" class="${!state.cutaway?'sel':''}">Solid shell</button></div><div class="row" style="gap:6px">${(state.floor==='first'?['Bedroom','Bathroom','Landing']:['Living room','Kitchen','Hall']).map(r=>`<button class="secondary" style="flex:1;font-size:11px;padding:8px 6px" data-room="${r}">${r}</button>`).join('')}</div><p class="tiny" id="house-feedback" style="margin-top:10px" aria-live="polite">Floors share one origin. Exploded spacing is view-only.</p></div>${nav('house')}</div>`}
function settings(){return `<div class="app-body">${header('Settings','Workspace','placement')}<div class="pad"><div class="section-title" style="margin-top:0">Placement</div><div class="settings-row"><h3>Furniture movement</h3><div class="seg"><button data-mode="grid" class="${state.mode==='grid'?'sel':''}" aria-pressed="${state.mode==='grid'}">Grid Snap</button><button data-mode="free" class="${state.mode==='free'?'sel':''}" aria-pressed="${state.mode==='free'}">Free Move</button></div><p class="setting-hint">${state.mode==='grid'?'Snap the furniture centre to a 10 cm grid on its floor. Rotate in 15° steps.':'Move continuously on the floor, without snapping. Enter exact positions; rotate continuously.'}</p></div><div class="settings-row"><div class="row between"><strong>Grid spacing</strong><span class="small">10 cm (0.10 m)</span></div><p class="setting-hint">Wall and overlap checks apply in both modes.</p></div><div class="section-title">Measurements</div><div class="settings-row"><div class="row between"><strong>Display units</strong><select id="units" class="field-select" style="width:140px;margin:0;font-size:12px"><option value="m" ${state.units==='m'?'selected':''}>Metres / cm</option><option value="ft" ${state.units==='ft'?'selected':''}>Feet / inches</option></select></div></div><div class="section-title">Project storage</div><div class="settings-row"><div class="row between"><strong>Saved on this phone</strong>${icon('hard-drive')}</div><p class="setting-hint">Automatic saves with undo and recovery.</p></div><div class="settings-row"><div class="row between"><strong>Account & device sync</strong><span class="pill">Later phase</span></div><p class="setting-hint">Open the same project on a computer.</p></div></div>${nav('plan')}</div>`}
function upload(){return `<div class="app-body">${header('Upload floor plan','New project','projects')}<div class="pad"><div class="row between"><h3>Image or PDF</h3>${soonBadge()}</div><div class="upload-paper"><span class="tiny">GROUND FLOOR · SAMPLE</span><svg viewBox="0 0 180 145" role="img" aria-label="Sample house plan"><path d="M12 15H167V126H12ZM100 15V126M100 76H167" fill="#f0eee8" stroke="#303942" stroke-width="3"/><path d="M100 46V64M35 126H52" stroke="#fff" stroke-width="5"/><text x="55" y="67" text-anchor="middle" font-size="10" fill="#303942">LIVING</text><text x="133" y="48" text-anchor="middle" font-size="10" fill="#303942">KITCHEN</text><text x="132" y="104" text-anchor="middle" font-size="10" fill="#303942">HALL</text></svg><span class="tiny">Check scale before creating rooms</span></div><div class="col"><div><h3>1. Choose a plan</h3><p class="small">Select an image or PDF and assign each floor.</p></div><div><h3>2. Check detected geometry</h3><p class="small">Correct walls, doors and room boundaries.</p></div><div><h3>3. Set scale and create rooms</h3><p class="small">Confirm a known dimension before generating 3D.</p></div></div><div class="notice">Trace unclear areas manually. Review the generated layout before committing it.</div><div style="margin-top:18px">${btn('Choose plan','disabled','primary')}</div><button class="link-btn" data-go="plan" style="width:100%">Create floor plan manually</button></div></div>`}
function soonBadge(){return '<span class="availability-badge">Coming soon</span>'}
function entryOption(name,description,symbol,target,soon=false){return `<button class="entry" data-entry="${target}" data-go="${target}"><span class="entry-symbol">${icon(symbol)}</span><span class="copy"><strong>${name}</strong><small>${description}</small></span>${soon?soonBadge():icon('chevron-right')}</button>`}
function brandHeader(variant='compact'){
 if(variant==='centered')return `<header class="brand-header centered"><span class="brand-mark"><img src="${oisLogo}" alt="OIS"></span><span class="brand-name">Designs</span><button class="icon-btn" data-go="settings" aria-label="Settings">${icon('sliders-horizontal')}</button></header>`;
 if(variant==='cover')return `<header class="brand-header cover"><img class="brand-full" src="${oisLogo}" alt="OIS Designs — Oriented In Silence"><button class="icon-btn" data-go="settings" aria-label="Settings">${icon('sliders-horizontal')}</button></header>`;
 return `<header class="brand-header"><span class="brand-mark"><img src="${oisLogo}" alt="OIS"></span><span class="brand-name">Designs</span><button class="icon-btn" data-go="settings" aria-label="Settings">${icon('sliders-horizontal')}</button></header>`;
}
function startContent(variant='compact'){return `<div class="app-body">${brandHeader(variant)}<div class="pad start-title"><h1>Projects</h1></div><section class="pad start-options" aria-label="New project"><h3>New project</h3>${entryOption('Create floor plan','Add rooms and enter dimensions.','layout-template','plan')}${entryOption('Upload floor plan','Use an image or PDF of your house plan.','file-up','upload',true)}${entryOption('Scan Room','Capture room geometry with your phone.','scan-line','scan',true)}</section><section class="pad recent-projects"><h3>Recent projects</h3><button class="project-row" data-go="plan"><img src="${oisOffice}" alt="OIS office reference for sample project"><span><strong>Maple House</strong><small>Sample · 2 floors · 6 rooms</small></span>${icon('chevron-right')}</button></section></div>`}
function add(){return `<div class="app-body">${header('Add',state.room,'editor')}<div class="pad col">${entryOption('Room','Add a generic room and set its dimensions.','layout-template','plan')}${entryOption('Door or opening','Connect rooms through a shared wall.','door-open','doors')}${entryOption('Furniture','Choose a set, then place individual pieces.','armchair','catalog')}</div></div>`}
function doorMeasurements(){const w=state.doorWidth,o=state.doorOffset;return {aLeft:o,aRight:3-o-w,bLeft:o-.6,bRight:3-o-w,w}}
function doorArt(){const v=doorMeasurements(),k=87.333333,x=40+v.aLeft*k,r=x+v.w*k,end=302,bStart=92.4,y=129,sgn=state.doorInto==='living'?-1:1,dy=sgn*v.w*k;let motion='';
 if(state.doorType==='swing')motion=`<path d="M${x} ${y}V${y+dy}Q${r} ${y+dy} ${r} ${y}" fill="none" stroke="#86663e" stroke-width="1.5"/>`;
 if(state.doorType==='double'){let d=dy/2;motion=`<path d="M${x} ${y}V${y+d}Q${x+v.w*k/2} ${y+d} ${x+v.w*k/2} ${y}M${r} ${y}V${y+d}Q${x+v.w*k/2} ${y+d} ${x+v.w*k/2} ${y}" fill="none" stroke="#86663e" stroke-width="1.5"/>`}
 if(state.doorType==='sliding')motion=`<rect x="${r+3}" y="${y-14}" width="${v.w*k}" height="5" fill="#aa8b61"/><path d="M${x} ${y-18}H${r+v.w*k}" stroke="#86663e" fill="none"/>`;
 if(state.doorType==='pocket')motion=`<rect x="${r}" y="${y-2}" width="${v.w*k}" height="12" fill="none" stroke="#86663e" stroke-dasharray="3 2"/><line x1="${r}" y1="${y+4}" x2="${r+v.w*k}" y2="${y+4}" stroke="#aa8b61" stroke-width="3"/>`;
 function chain(start,a,b,end,y,values){return `<path d="M${start} ${y}H${end}M${start} ${y-5}V${y+5}M${a} ${y-5}V${y+5}M${b} ${y-5}V${y+5}M${end} ${y-5}V${y+5}" fill="none" stroke="#7a756b"/><g font-size="11" text-anchor="middle" fill="currentColor"><text x="${(start+a)/2}" y="${y-8}">${values[0].toFixed(2)}</text><text x="${(a+b)/2}" y="${y-8}">${values[1].toFixed(2)}</text><text x="${(b+end)/2}" y="${y-8}">${values[2].toFixed(2)}</text></g>`}
 return `<svg class="scene door-scene" viewBox="0 0 342 270" role="img" aria-label="Door in shared wall, with left clearance, opening width and right clearance measured on both room faces"><rect x="40" y="37" width="262" height="92" fill="#e6ddcc"/><rect x="92.4" y="141" width="209.6" height="91" fill="#dfdfd5"/><text x="171" y="29" text-anchor="middle" fill="currentColor" font-size="12">Living room · 3.00 m wall face</text><text x="184" y="251" text-anchor="middle" fill="currentColor" font-size="12">Kitchen · 2.40 m wall face</text><path d="M40 135H${x}M${r} 135H302" stroke="#646b6b" stroke-width="12"/><path d="M${x} 128V142M${r} 128V142" stroke="#86663e" stroke-width="2"/>${motion}${chain(40,x,r,end,67,[v.aLeft,v.w,v.aRight])}${chain(bStart,x,r,end,211,[v.bLeft,v.w,v.bRight])}<text x="171" y="266" text-anchor="middle" fill="currentColor" font-size="11">Corner → opening → corner · metres</text></svg>`
}
function doors(){const types=[['swing','Single swing'],['double','Double swing'],['sliding','Surface sliding'],['pocket','Pocket sliding'],['opening','Open doorway']];let v=doorMeasurements();return `<div class="app-body">${header('Place door','Living room ↔ kitchen','editor')}<div class="canvas door-canvas">${doorArt()}</div><div class="sheet"><div class="handle"></div><h3>Door type</h3><div class="door-types">${types.map(([id,n])=>`<button data-door-type="${id}" class="${state.doorType===id?'sel':''}" aria-pressed="${state.doorType===id}">${n}</button>`).join('')}</div><div class="field-row"><label>Clear width (m)<input id="door-width" type="number" min=".6" max="1.8" step=".05" value="${state.doorWidth}"></label><label>Opening height (m)<input id="door-height" type="number" min="1.8" max="2.4" step=".05" value="${state.doorHeight}"></label></div><label class="door-offset-label" for="door-offset">Position from living-room left corner · ${state.doorOffset.toFixed(2)} m</label><input id="door-offset" type="range" min=".75" max="${(2.85-state.doorWidth).toFixed(2)}" step=".05" value="${state.doorOffset}" aria-label="Door position from living room left corner"><div class="door-clearances" aria-live="polite"><span>Living room: ${v.aLeft.toFixed(2)} | ${v.w.toFixed(2)} | ${v.aRight.toFixed(2)} m</span><span>Kitchen: ${v.bLeft.toFixed(2)} | ${v.w.toFixed(2)} | ${v.bRight.toFixed(2)} m</span></div>${['swing','double'].includes(state.doorType)?`<div class="seg"><button data-door-into="living" class="${state.doorInto==='living'?'sel':''}">Swing into living</button><button data-door-into="kitchen" class="${state.doorInto==='kitchen'?'sel':''}">Swing into kitchen</button></div>`:`<p class="tiny">${state.doorType==='pocket'?'Dashed section: pocket space inside the wall.':state.doorType==='sliding'?'Panel and track need clear wall space.':'Opening has no door leaf.'}</p>`}<div class="notice">${state.doorHeight>Math.min(state.roomHeights['Living room'],state.roomHeights.Kitchen)?'Opening exceeds the lower room ceiling.':(['pocket','sliding'].includes(state.doorType)&&v.aRight<state.doorWidth)?'Insufficient right-side space for the panel. Adjust position or width.':'Both wall faces and door motion remain visible during placement.'}</div><div class="placement-actions">${btn('Cancel','data-go="editor"')}${btn('Place door','data-action="commit-door"','primary')}</div></div></div>`}
function heightArt(){let a=state.roomHeights['Living room'],b=state.roomHeights.Kitchen;return `<svg class="scene" viewBox="0 0 342 200" role="img" aria-label="Section view of adjacent rooms with independent flat ceiling heights"><rect x="25" y="${170-a*38}" width="145" height="${a*38}" fill="#e3d6c0"/><rect x="170" y="${170-b*38}" width="145" height="${b*38}" fill="#dce1d5"/><path d="M25 170H315M25 170V${170-a*38}H170V170M170 170V${170-b*38}H315V170" fill="none" stroke="#6b7371" stroke-width="4"/><g fill="currentColor" text-anchor="middle" font-size="12"><text x="97" y="40">Living room</text><text x="243" y="40">Kitchen</text><text x="97" y="145">${a.toFixed(2)} m</text><text x="243" y="145">${b.toFixed(2)} m</text><text x="171" y="192" font-size="11">Section view · same floor level</text></g></svg>`}
function heights(){return `<div class="app-body">${header('Room properties',state.room,'editor')}${roomNav()}<div class="canvas height-canvas">${heightArt()}</div><div class="sheet"><div class="handle"></div><h3>Ceiling height</h3><p class="small">${state.room} only</p><label style="margin:14px 0">Height above finished floor (m)<input id="ceiling-height" type="number" min="2" max="4" step=".05" value="${state.roomHeights[state.room]||state.floorHeight}"></label><p class="tiny">Floor default: ${state.floorHeight.toFixed(2)} m. Editing this room leaves adjacent rooms unchanged.</p><div class="property-summary"><span>Ceiling shape</span><strong>Flat</strong></div><div class="property-summary"><span>Sloped / vaulted ceilings</span><span class="pill">Later phase</span></div><p class="setting-hint">Ceiling clearance is separate from the floor-to-floor elevation.</p></div></div>`}
function scan(){return `<div class="app-body">${header('Scan Room','New project','projects')}<div class="pad"><div class="row between"><h3>Room capture</h3>${soonBadge()}</div><div class="upload-paper scan-diagram">${icon('scan-line')}<span>Capture preview</span></div><div class="col"><div><h3>1. Check device support</h3><p class="small">Use a supported capture provider or create rooms manually.</p></div><div><h3>2. Capture and check dimensions</h3><p class="small">Review scale, walls and openings before importing.</p></div><div><h3>3. Edit the imported room</h3><p class="small">Use the same materials and furniture tools.</p></div></div><div class="notice">LiDAR capture is unavailable on a standard iPhone 13. Camera reconstruction needs separate validation.</div><div style="margin-top:18px">${btn('Start capture','disabled','primary')}</div><button class="link-btn" data-go="plan" style="width:100%">Create floor plan manually</button></div></div>`}
function initLogoStudies(){root.querySelectorAll('[data-brand-variant]').forEach(el=>el.innerHTML=startContent(el.dataset.brandVariant))}
function constrain(){let p=item(),r=state.rotation*Math.PI/180,hx=(Math.abs(p.w*Math.cos(r))+Math.abs(p.d*Math.sin(r)))/2,hz=(Math.abs(p.w*Math.sin(r))+Math.abs(p.d*Math.cos(r)))/2;state.x=Math.max(hx,Math.min(4-hx,state.x));state.z=Math.max(hz,Math.min(3-hz,state.z))}
function render(){if(rendering)return;rendering=true;try{constrain();const logoView=state.screen==='logos';root.querySelector('.phone').hidden=logoView;root.querySelector('#ois-logo-studies').hidden=!logoView;if(!logoView)screen.innerHTML=({projects,plan,finishes,catalog,detail,placement,house,settings,upload,scan,add,doors,heights}[state.screen]||projects)();root.querySelectorAll('[data-screen]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.screen===state.screen)));root.querySelector('#screen-caption').textContent=captions[state.screen]||'Design concept';if(globalThis.lucide)lucide.createIcons();bindDrag()}finally{rendering=false}}
function push(){history.push({...state});if(history.length>30)history.shift()}
root.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-surface]');if(!el||!root.contains(el)||el.disabled)return;
 if(el.dataset.screen){go(el.dataset.screen);return}if(el.dataset.go){go(el.dataset.go);return}
 if(el.dataset.set!==undefined){state.set=Number(el.dataset.set);state.piece=null;go('detail');return}
 if(el.dataset.piece){state.piece=el.dataset.piece;go('placement');return}
 if(el.dataset.surface){push();state.surface=el.dataset.surface;state.wallFace=el.dataset.wall||state.wallFace;state.material=state.surface==='floor'?state.floorMaterial:state.wallMaterials[state.wallFace];render();persist();return}
 if(el.dataset.material!==undefined){push();state.material=Number(el.dataset.material);if(state.surface==='floor')state.floorMaterial=state.material;else state.wallMaterials={...state.wallMaterials,[state.wallFace]:state.material};render();persist();return}
 if(el.dataset.mode){state.mode=el.dataset.mode;render();persist();return}
 if(el.dataset.floor){state.floor=el.dataset.floor;render();persist();return}
 if(el.dataset.room){state.room=el.dataset.room;go('finishes');return}
 if(el.dataset.nudge){push();let step=state.mode==='grid'?.1:.01;state.x+=el.dataset.nudge==='right'?step:el.dataset.nudge==='left'?-step:0;state.z+=el.dataset.nudge==='up'?step:el.dataset.nudge==='down'?-step:0;constrain();render();persist();return}
 if(el.dataset.doorType){state.doorType=el.dataset.doorType;state.doorWidth=state.doorType==='double'?1.6:.9;state.doorOffset=Math.min(state.doorOffset,2.85-state.doorWidth);render();persist();return}
 if(el.dataset.doorInto){state.doorInto=el.dataset.doorInto;render();persist();return}
 const a=el.dataset.action;if(a==='commit-door'){let v=doorMeasurements();if(state.doorHeight>Math.min(state.roomHeights['Living room'],state.roomHeights.Kitchen)||(['pocket','sliding'].includes(state.doorType)&&v.aRight<state.doorWidth))return;go('plan');screen.querySelector('#plan-feedback').textContent='Door configuration preview: '+state.doorType+' · '+state.doorWidth.toFixed(2)+' m clear opening.';return}
 if(a==='undo'&&history.length){state=history.pop();render();persist()}
 if(a==='rotate'){push();state.rotation=(state.rotation+(state.mode==='grid'?15:1))%360;render();persist()}
 if(a==='next-wall'){state.surface='wall';state.wallFace=state.wallFace==='north'?'east':'north';state.material=state.wallMaterials[state.wallFace];render();screen.querySelector('.sheet .tiny').textContent=state.wallFace==='north'?'North wall only':'East wall only';persist()}
 if(a==='add-room')screen.querySelector('#plan-feedback').textContent='Concept: choose Rectangle, L-shape or a room template, then enter dimensions.';
 if(a==='connect')screen.querySelector('#plan-feedback').textContent='Select touching walls, then add a shared doorway. Overlaps require correction.';
 if(a==='cutaway'){state.cutaway=!state.cutaway;render();screen.querySelector('#house-feedback').textContent=state.cutaway?'Ceilings and front walls hidden for access.':'Solid exterior view planned; return to Dollhouse to select rooms.';persist()}
 if(a==='fit-house'){screen.querySelector('#house-feedback').textContent='Camera reset to the whole-house view (concept).'}
 if(a==='reset-view'){push();state.x=2;state.z=1.5;render();persist()}
});
root.addEventListener('change',e=>{if(e.target.id==='room-select'){state.room=e.target.value;render()}if(e.target.id==='units'){state.units=e.target.value;render()}if(['width','depth'].includes(e.target.id)){let v=Number(e.target.value);if(v>=1&&v<=20){state[e.target.id==='width'?'dimW':'dimD']=v;render();screen.querySelector('#plan-feedback').textContent='Dimension preview updated. Connected-room adjustment will need confirmation.'}}persist()});
root.addEventListener('change',e=>{
 if(e.target.id==='ceiling-height'){let v=Number(e.target.value);if(v>=2&&v<=4){state.roomHeights={...state.roomHeights,[state.room]:v};render();persist()}}
 if(['door-width','door-height','door-offset'].includes(e.target.id)){const v=Number(e.target.value),key={'door-width':'doorWidth','door-height':'doorHeight','door-offset':'doorOffset'}[e.target.id];if(Number.isFinite(v)&&v>0){state[key]=v;state.doorWidth=Math.max(.6,Math.min(1.8,state.doorWidth));state.doorOffset=Math.max(.75,Math.min(2.85-state.doorWidth,state.doorOffset));render();persist()}}
});
root.addEventListener('input',e=>{if(e.target.id==='door-offset'){state.doorOffset=Number(e.target.value);screen.querySelector('.door-canvas').innerHTML=doorArt();let v=doorMeasurements();screen.querySelector('.door-offset-label').textContent='Position from living-room left corner · '+state.doorOffset.toFixed(2)+' m';screen.querySelector('.door-clearances').innerHTML='<span>Living room: '+v.aLeft.toFixed(2)+' | '+v.w.toFixed(2)+' | '+v.aRight.toFixed(2)+' m</span><span>Kitchen: '+v.bLeft.toFixed(2)+' | '+v.w.toFixed(2)+' | '+v.bRight.toFixed(2)+' m</span>'}});
function bindDrag(){const zone=screen.querySelector('.drag-zone');if(!zone)return;let start=null;zone.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-sofa]'))return;push();start={px:e.clientX,py:e.clientY,x:state.x,z:state.z};zone.setPointerCapture(e.pointerId)});zone.addEventListener('pointermove',e=>{if(!start)return;let scale=zone.getBoundingClientRect().width/342,step=state.mode==='grid'?.1:.001;state.x=Math.round((start.x+(e.clientX-start.px)/(60*scale))/step)*step;state.z=Math.round((start.z-(e.clientY-start.py)/(60*scale))/step)*step;constrain();zone.querySelector('[data-sofa]').setAttribute('transform',`translate(${48+state.x*60} ${215-state.z*60}) rotate(${state.rotation})`);screen.querySelector('.move-feedback span').textContent=`X ${length(state.x)} · Z ${length(-state.z)}`});zone.addEventListener('pointerup',()=>{if(start){start=null;render();persist()}});zone.addEventListener('pointercancel',()=>{if(start){state=history.pop()||state;start=null;render()}})}
initLogoStudies();
render();
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&s.previewVersion===2){state={...defaults,...s};render()}});

})();
</script>
