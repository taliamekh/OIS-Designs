const saved=window.openai?.widgetState?.privateContent;let state={...defaults,...(saved?.version===3?saved:{})},undo=[],redo=[],rendering=false;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,soon=()=>'<span class="badge soon">Coming soon</span>';
function remember(){window.openai?.setWidgetState?.({modelContent:{screen:state.page,view:state.view,room:state.room,floor:floorNames[state.floor],wallColour:state.wallColor,wallTexture:state.wallTexture,sheen:state.sheen,baseboard:state.trim,units:state.unit,quickMove:state.quickMove},privateContent:state}).catch(()=>{})}
function domain(){return JSON.parse(JSON.stringify({width:state.width,depth:state.depth,height:state.height,floor:state.floor,wallColor:state.wallColor,wallTexture:state.wallTexture,sheen:state.sheen,trim:state.trim,trimHeight:state.trimHeight,trimProjection:state.trimProjection,items:state.items,doors:state.doors}))}
function checkpoint(){undo.push(domain());if(undo.length>30)undo.shift();redo=[]}
function go(page){if(page==='settings')state.settingsReturn=state.page;if(page==='editor')state.message='';state.page=page;render();remember()}
function number(m){return Number((state.unit==='m'?m:m/.3048).toFixed(state.unit==='m'?2:3))}
function measure(m){if(state.unit==='m')return m.toFixed(2)+' m';const inches=Math.round(m/.0254);return Math.floor(inches/12)+'′ '+inches%12+'″'}
function metres(value){return Number(value)*(state.unit==='m'?1:.3048)}
function asset(id){return data.catalog.find(a=>a.id===id)||data.catalog[0]}
function selected(){return state.items.find(i=>i.id===state.selected)}
function head(title,back='editor',sub='Maple House'){return `<header class="header"><button class="icon" data-go="${back}" aria-label="${back==='home'?'Projects':'Back'}">${icon(back==='home'?'folder':'arrow-left')}</button><div class="header-copy">${sub?`<small>${sub}</small>`:''}${state.page==='editor'?`<button class="project-title" data-go="house" aria-label="Project floors"><h2>${title}</h2>${icon('chevron-down')}</button>`:`<h2>${title}</h2>`}</div>${state.page!=='settings'?`<button class="icon" data-go="settings" aria-label="Settings">${icon('settings-2')}</button>`:''}</header>`}
function unitButton(){return `<button class="units-button" data-act="units" aria-label="Switch metres or feet">${state.unit==='m'?'m':'ft'}</button>`}
function option(title,desc,symbol,target,unavailable=false){return `<button class="entry" data-go="${target}" data-entry="${target}"><span class="entry-icon">${icon(symbol)}</span><span class="entry-copy"><strong>${title}</strong><small>${desc}</small></span>${unavailable?soon():icon('chevron-right')}</button>`}

function modelViewport(){return `<div class="viewport" data-viewport="true"><span class="loading-scene" role="status">Loading 3D review models…</span>${state.view==='walk'?'':`<div class="canvas-tools"><button class="icon" data-act="undo" aria-label="Undo" ${undo.length?'':'disabled'}>${icon('undo-2')}</button><button class="icon" data-act="redo" aria-label="Redo" ${redo.length?'':'disabled'}>${icon('redo-2')}</button></div><span class="mode-chip">${state.grid?'Grid · 10 cm':'Free move'}</span>`}</div>`}
function planArt(){const active=state.doorTool,door=state.doors.find(d=>d.id===state.selectedDoor),scale=50;return `<svg viewBox="0 0 342 340" role="img" aria-label="Floor plan: tap a wall to place doors; dimensions appear on each room face"><defs><pattern id="ois-plan-grid" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="currentColor" opacity=".16"/></pattern></defs><rect width="342" height="340" fill="url(#ois-plan-grid)"/><rect x="20" y="70" width="200" height="150" fill="#e5dccb"/><rect x="220" y="100" width="100" height="120" fill="#e2e3dc"/><path d="M20 220V70H220V100H320V220H20M220 100V220" fill="none" stroke="#626d71" stroke-width="5"/><path d="M220 100V220" stroke="${active?'#a27c49':'transparent'}" stroke-width="12" opacity=".35"/><g fill="#30383e" text-anchor="middle" font-size="12"><text x="103" y="131">${rooms[state.room]}</text><text x="103" y="151">${measure(state.width)} × ${measure(state.depth)}</text><text x="274" y="126">Kitchen</text></g>${furniturePlanArt()}${state.doors.map(doorPlan).join('')}${door?doorDimensions(door):''}${state.drawn?.length?`<polyline points="${state.drawn.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#927347" stroke-width="3"/>`:''}</svg>`}
function doorPlan(d){const y=70+d.offset*50,h=d.width*50,c=d.id===state.selectedDoor?'#9d7138':'#8d8170';let mark='';if(d.type==='swing')mark=`<path d="M220 ${y}H${220-h}Q${220-h} ${y+h} 220 ${y+h}" fill="none" stroke="${c}" stroke-width="1.5"/>`;else if(d.type==='double')mark=`<path d="M220 ${y}H${220-h/2}Q${220-h/2} ${y+h/2} 220 ${y+h/2}M220 ${y+h}H${220-h/2}Q${220-h/2} ${y+h/2} 220 ${y+h/2}" fill="none" stroke="${c}" stroke-width="1.5"/>`;else if(d.type==='sliding')mark=`<rect x="209" y="${y}" width="4" height="${h}" fill="${c}"/><path d="M206 ${y}V${Math.min(220,y+1.8*h)}" stroke="${c}" stroke-dasharray="3 2"/>`;else if(d.type==='pocket')mark=`<rect x="216" y="${y+h}" width="8" height="${Math.min(h,220-y-h)}" fill="none" stroke="${c}" stroke-dasharray="3 2"/>`;else mark=`<path d="M215 ${y}H225M215 ${y+h}H225" stroke="${c}" stroke-width="2"/>`;return `<g data-door-kind="${d.type}"><path d="M220 ${y}V${y+h}" stroke="#e6dfd3" stroke-width="7"/>${mark}</g>`}
function doorDimensions(d){let y=70+d.offset*50,end=y+d.width*50,a=[d.offset,d.width,3-d.offset-d.width],b=[d.offset-.6,d.width,3-d.offset-d.width];return `<g stroke="#7d6c51" fill="none"><path d="M194 70V220M190 70H198M190 ${y}H198M190 ${end}H198M190 220H198M241 100V220M237 100H245M237 ${y}H245M237 ${end}H245M237 220H245"/></g><g fill="#3e3c34" font-size="11"><text x="185" y="59">A</text><text x="236" y="90">B</text><text x="20" y="267">A · Living room</text><text x="137" y="267">${a.map(v=>measure(v)).join(' | ')}</text><text x="20" y="293">B · Kitchen</text><text x="137" y="293">${b.map(v=>measure(v)).join(' | ')}</text><text x="137" y="315" font-size="10">Corner | opening | corner</text></g>`}

function trim(){return `<div class="screen">${head('Baseboards','editor',rooms[state.room])}${modelViewport()}<section class="property-panel"><h3>Profile</h3><div class="profile-grid">${['None','Flat','Bevel','Colonial','Stepped'].map((n,i)=>`<button data-trim="${n}" class="${state.trim===n?'sel':''}"><svg viewBox="0 0 45 45" role="img" aria-label="${n} profile">${i===0?'<path d="M8 38H38"/>':`<path d="${['','M12 38V7H27V38Z','M12 38V12L23 7H27V38Z','M12 38V7Q28 3 21 17Q15 25 29 28V38Z','M12 38V7H21V16H27V25H32V38Z'][i]}"/>`}</svg>${n}</button>`).join('')}</div><div class="profile-fields"><label>Height (cm)<input id="trim-height" type="number" min="3" max="25" value="${state.trimHeight*100}"></label><label>Projection (mm)<input id="trim-projection" type="number" min="5" max="35" value="${state.trimProjection*1000}"></label></div><button class="link" data-act="trim-reference">Add profile reference</button>${state.message?`<p class="tiny" role="status">${state.message}</p>`:''}</section></div>`}
const doorTypes={swing:'Swing',double:'Double swing',sliding:'Slide on wall',pocket:'Slide into wall',opening:'Open doorway'};
function doorTypeArt(type){return `<svg viewBox="0 0 116 62" role="img" aria-label="${doorTypes[type]} opening diagram"><path d="M4 42H35M79 42H112" stroke="currentColor" stroke-width="6" fill="none"/>${type==='swing'?'<path d="M35 42V3Q79 3 79 42" fill="none" stroke="#997348" stroke-width="2"/>':type==='double'?'<path d="M35 42V20Q57 20 57 42M79 42V20Q57 20 57 42" fill="none" stroke="#997348" stroke-width="2"/>':type==='sliding'?'<path d="M35 31H113" stroke="#997348"/><rect x="79" y="25" width="33" height="5" fill="#b29774"/>':type==='pocket'?'<rect x="79" y="36" width="33" height="12" fill="none" stroke="#997348" stroke-dasharray="3 2"/><path d="M79 42H112" stroke="#b29774" stroke-width="2"/>':'<path d="M35 35V49M79 35V49" stroke="#997348" stroke-width="2"/>'}</svg>`}
function doors(){return `<div class="screen">${head('Choose a door','editor','Build')}<div class="pad"><div class="door-grid">${Object.entries(doorTypes).map(([id,n])=>`<button class="door-card ${state.doorType===id?'sel':''}" data-door-type="${id}" aria-pressed="${state.doorType===id}">${doorTypeArt(id)}${n}</button>`).join('')}</div><details style="margin-top:15px"><summary>Opening size · ${measure(state.doorWidth)} × ${measure(state.doorHeight)}</summary><div class="door-properties"><label>Width (${state.unit})<input id="door-width" type="number" value="${number(state.doorWidth)}" step=".05"></label><label>Height (${state.unit})<input id="door-height" type="number" value="${number(state.doorHeight)}" step=".05"></label></div></details><label class="check"><input id="repeat-doors" type="checkbox" ${state.repeatDoors?'checked':''}>Keep placing this door</label><div style="margin-top:15px"><button class="primary" data-act="use-door">Use door on floor plan ${icon('arrow-right')}</button></div></div></div>`}
function filtered(){return data.catalog.filter(a=>{const q=state.search.toLowerCase().trim();return (!q||(a.name+' '+a.family+' '+a.room+' '+a.theme+' '+a.bedSize).toLowerCase().includes(q))&&(state.filterRoom==='all'||(a.rooms||[a.room]).includes(state.filterRoom))&&(state.filterTheme==='all'||a.theme===state.filterTheme)&&(state.filterType==='all'||a.category===state.filterType)&&(state.filterBed==='all'||a.bedSize===state.filterBed)&&(state.filterColor==='all'||a.colour===state.filterColor)&&(!state.onlyFavourites||state.favourites.includes(a.id))})}
function catalog(){const list=filtered(),start=state.catalogPage*5,shown=list.slice(start,start+5);return `<div class="screen">${head('Furniture','editor',rooms[state.room])}<div class="catalog-search"><input id="catalog-search" type="search" placeholder="Search furniture" value="${state.search.replaceAll('&','&amp;').replaceAll('"','&quot;')}" aria-label="Search furniture"><button class="icon" data-act="filters" aria-label="Search filters" aria-expanded="${state.filtersOpen}">${icon('sliders-horizontal')}</button><button class="icon" data-act="only-favourites" aria-label="Show favourites" aria-pressed="${state.onlyFavourites}">${icon(state.onlyFavourites?'heart-handshake':'heart')}</button></div><div class="pad" style="padding-top:0;padding-bottom:8px"><label class="inline-select">Theme<select id="filter-theme"><option value="all">All themes</option>${Object.entries(themes).map(([k,n])=>`<option value="${k}" ${state.filterTheme===k?'selected':''}>${n}</option>`).join('')}</select></label></div>${state.filtersOpen?`<div class="filters"><label>Room<select id="filter-room"><option value="all">All rooms</option>${Object.entries(rooms).map(([k,n])=>`<option value="${k}" ${state.filterRoom===k?'selected':''}>${n}</option>`).join('')}</select></label><label>Type<select id="filter-type"><option value="all">All types</option>${[...new Set(data.catalog.map(a=>a.category))].map(n=>`<option ${state.filterType===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Bed size / type<select id="filter-bed"><option value="all">All sizes</option>${['twin','full','queen','king','bunk','loft'].map(n=>`<option ${state.filterBed===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Colour family<select id="filter-color"><option value="all">All colours</option>${['light','brown','dark','blue-grey'].map(n=>`<option ${state.filterColor===n?'selected':''}>${n}</option>`).join('')}</select></label></div>`:''}<p class="count" aria-live="polite">${list.length} ${list.length===1?'result':'results'}${state.search?' · '+state.search:''}</p><div class="catalog-list">${shown.length?shown.map(a=>`<div class="catalog-line"><button class="catalog-item" data-asset="${a.id}"><img src="${data.thumbs[a.family]}" alt="${a.name} real-model render"><span class="catalog-copy"><strong>${a.name}</strong><small>${themes[a.theme]}</small><small>${measure(a.width)} × ${measure(a.depth)}${a.bedSize?' · '+a.bedSize:''}</small></span>${icon('plus')}</button><button class="favourite ${state.favourites.includes(a.id)?'sel':''}" data-favourite="${a.id}" aria-label="Favourite ${a.name}" aria-pressed="${state.favourites.includes(a.id)}">${icon('heart')}</button></div>`).join(''):'<p class="no-results">No matching furniture. Change the search or filters.</p>'}</div>${list.length>5?`<div class="pad row between"><button class="secondary" data-act="catalog-prev" ${start===0?'disabled':''}>Previous</button><span class="tiny">${start+1}–${Math.min(start+5,list.length)}</span><button class="secondary" data-act="catalog-next" ${start+5>=list.length?'disabled':''}>Next</button></div>`:''}<div class="spacer"></div></div>`}
function settings(){return `<div class="screen">${head('Settings',state.settingsReturn,'Workspace')}<div class="pad"><div class="setting-row"><h3>Furniture movement</h3><div class="segment"><button data-grid="true" class="${state.grid?'sel':''}">Grid Snap</button><button data-grid="false" class="${!state.grid?'sel':''}">Free Move</button></div><p class="tiny" style="margin-top:8px">${state.grid?'10 cm grid':'No position snapping'}</p></div><div class="setting-row"><label class="check"><input id="quick-move" type="checkbox" ${state.quickMove?'checked':''}>Quick move unlocked furniture</label></div><div class="setting-row"><div class="row between"><h3>Measurements</h3>${unitButton()}</div><p class="tiny">${state.unit==='m'?'Metres':'Feet and inches'}</p></div><div class="setting-row"><h3>Local saving</h3><p class="small" style="margin-top:7px">Undo, recovery and project export</p></div><div class="setting-row row between"><h3>Account & sync</h3><span class="badge">Later phase</span></div></div></div>`}
