ad h2{font-size:18px;margin:0}.check{display:flex;align-items:center;gap:12px;min-height:48px}.check input{width:20px;height:20px;accent-color:#63856a}.hint{font-size:12px;color:#596c5e;margin:5px 0 12px}#selection{margin-top:8px;font-weight:600}#status{font-weight:500}#error{color:#9a302b}body.large{font-size:22px}body.large header{height:90px}body.large main{height:calc(100dvh - 90px)}body.large .hint,body.large .label,body.large #note{font-size:17px}body.large #sheet{max-height:calc(100% - 90px)}@media(max-width:500px){header{padding:9px 12px}header small{max-width:180px}#context{gap:6px}#context select{max-width:calc(50vw - 18px);font-size:14px}#sheet{left:12px;right:12px;width:auto;bottom:76px;max-height:65%}#note{font-size:11px;max-width:calc(100% - 24px)}body.large #context select{font-size:18px;max-width:calc(50vw - 18px)}body.large #note{bottom:82px}body.large .row{margin-bottom:9px}body.large header strong{font-size:20px}}

<header><div><strong>ois designs</strong><small>Phase 3 · browser review</small></div><button id="views" aria-expanded="false" aria-controls="sheet">Views</button></header>
<main>
 <div id="canvas" aria-label="Furnished house in 3D"></div>

 </section>
